name: build

# Pull requests build everything except the Windows app (test APKs come
# from these runs). main and v* tags build everything too. To get a Windows
# test build of a branch: Actions > build > Run workflow, tick "windows".
#
# Releases (see docs/HANDOVER.md, "Making a release"): Actions > build >
# Run workflow on main with "release" ticked, or push a v<version> tag.
# Either way the version is the one in app/pubspec.yaml (no -test suffix),
# the APK must be signed with the release key, and the "release" job
# creates the GitHub release v<version> with the notes from
# docs/releases/<version>.md, the Windows zip and the APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Build the Windows app too
        type: boolean
        default: false
      release:
        description: Publish a GitHub release of the pubspec version (main only)
        type: boolean
        default: false

# The repo is public: the workflow token can only read the repo. Signing
# secrets are never passed to pull requests from forks.
permissions:
  contents: read

env:
  # "true" only for a manual run with "release" ticked (read by
  # tools/ci-version.sh and the release job).
  CHIPDECK_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure (MSVC, newest Visual Studio on the runner)
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render test tune to WAV
        run: |
          build\Release\chipdeck-cli.exe -t 5 -w test.wav tests\data\chipdeck-test.sid
          build\Release\chipdeck-cli.exe -t 5 -w test-sndh.wav tests\data\chipdeck-test.sndh
          build\Release\chipdeck-cli.exe -t 5 -w test-ym.wav tests\data\chipdeck-test.ym
          build\Release\chipdeck-cli.exe -t 5 -w test-tfmx.wav tests\data\mdat.chipdeck-test
          build\Release\chipdeck-cli.exe -t 5 -w test-tfmxst.wav tests\data\mdat.chipdeck-st-test
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\chipdeck-cli.exe dist\
          Copy-Item tests\data\chipdeck-test.sid dist\
          Copy-Item tests\data\chipdeck-test.sndh dist\
          Copy-Item tests\data\chipdeck-test.ym dist\
          Copy-Item LICENSE dist\LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chipdeck-cli-windows-x64
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render test tune to WAV
        run: |
          ./build/chipdeck-cli -t 5 -w test.wav tests/data/chipdeck-test.sid
          ./build/chipdeck-cli -t 5 -w test-sndh.wav tests/data/chipdeck-test.sndh
          ./build/chipdeck-cli -t 5 -w test-ym.wav tests/data/chipdeck-test.ym
          ./build/chipdeck-cli -t 5 -w test-tfmx.wav tests/data/mdat.chipdeck-test
          ./build/chipdeck-cli -t 5 -w test-tfmxst.wav tests/data/mdat.chipdeck-st-test

  app-windows:
    if: github.event_name == 'push' || inputs.windows || inputs.release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
      - name: Version
        shell: bash
        run: tools/ci-version.sh
      - name: Build Windows app
        working-directory: app
        shell: bash
        run: flutter build windows --release --build-name=$CHIPDECK_VERSION --build-number=$CHIPDECK_BUILD --dart-define=CHIPDECK_VERSION=$CHIPDECK_VERSION
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse app\build\windows\x64\runner\Release dist\ChipDeck-$env:CHIPDECK_VERSION
          Copy-Item LICENSE dist\ChipDeck-$env:CHIPDECK_VERSION\LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chipdeck-app-windows-x64-${{ env.CHIPDECK_VERSION }}
          path: dist/

  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Version
        shell: bash
        run: tools/ci-version.sh
      - name: Analyze and build
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release --build-name=$CHIPDECK_VERSION --build-number=$CHIPDECK_BUILD --dart-define=CHIPDECK_VERSION=$CHIPDECK_VERSION

  # Quick check (seconds) that the Android signing secrets reach CI and
  # unlock the keystore, without waiting for the full APK build.
  android-signing-check:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          echo "ANDROID_KEYSTORE_BASE64: $([ -n "$KEYSTORE_BASE64" ] && echo set || echo missing)"
          echo "ANDROID_KEYSTORE_PASSWORD: $([ -n "$KEYSTORE_PASSWORD" ] && echo set || echo missing)"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then exit 0; fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/k.jks"
          keytool -list -keystore "$RUNNER_TEMP/k.jks" -storepass "$KEYSTORE_PASSWORD" | grep -iE "entry|chipdeck"
          rm -f "$RUNNER_TEMP/k.jks"

  app-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
      - name: Signing key from repository secrets (optional)
        # With the secrets set, every APK is signed with the same key and
        # installs as an update. Without them the build uses a debug key.
        working-directory: app/android
        run: |
          echo "ANDROID_KEYSTORE_BASE64: $([ -n "$KEYSTORE_BASE64" ] && echo set || echo missing)"
          echo "ANDROID_KEYSTORE_PASSWORD: $([ -n "$KEYSTORE_PASSWORD" ] && echo set || echo missing)"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$CHIPDECK_RELEASE" = "true" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A release APK must be signed with the release key."
              exit 1
            fi
            echo "::warning::Signing secrets not available; APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > release.jks
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "entry"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=chipdeck"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > key.properties
      - name: Version
        shell: bash
        run: tools/ci-version.sh
      - name: Build APK
        working-directory: app
        # One APK for all phones (arm64, 32-bit arm, x86_64). The build
        # number grows with every CI run so each APK installs as an update.
        run: flutter build apk --release --build-name=$CHIPDECK_VERSION --build-number=$CHIPDECK_BUILD --dart-define=CHIPDECK_VERSION=$CHIPDECK_VERSION
      - name: Package
        run: |
          mkdir -p dist
          APK="dist/ChipDeck-$CHIPDECK_VERSION.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          cp LICENSE dist/LICENSE.txt
          unzip -l "$APK" | grep libchipdeck.so
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -o "versionCode='[^']*' versionName='[^']*'" || true
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "subject" | head -1 || true
          rm -f app/android/release.jks app/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: chipdeck-app-android-${{ env.CHIPDECK_VERSION }}
          path: dist/

  # Publishes the GitHub release once every build has passed. Only this job
  # may write to the repo (it creates the tag and the release).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [windows, linux, app-windows, app-linux, app-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        shell: bash
        run: tools/ci-version.sh
      - name: Release notes
        run: |
          NOTES="docs/releases/$CHIPDECK_VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Write $NOTES before releasing."
            exit 1
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: chipdeck-app-*-${{ env.CHIPDECK_VERSION }}
          path: artifacts
      - name: Package
        run: |
          V="$CHIPDECK_VERSION"
          mkdir -p release
          (cd "artifacts/chipdeck-app-windows-x64-$V" && zip -qr "$GITHUB_WORKSPACE/release/ChipDeck-$V-windows-x64.zip" "ChipDeck-$V")
          cp "artifacts/chipdeck-app-android-$V/ChipDeck-$V.apk" "release/ChipDeck-$V-android.apk"
          (cd release && sha256sum * > "ChipDeck-$V-SHA256SUMS.txt")
          ls -l release
          cat release/*SHA256SUMS.txt
      - name: Publish
        run: |
          V="$CHIPDECK_VERSION"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "::error::Release v$V already exists. Bump the version in app/pubspec.yaml."
            exit 1
          fi
          gh release create "v$V" release/* \
            --target "$GITHUB_SHA" \
            --title "ChipDeck $V" \
            --notes-file "$NOTES"
